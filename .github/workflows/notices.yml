name: Refresh college notices
on:
  schedule: [{cron: "0 */2 * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 run.py
      - name: Commit changes
        run: |
          git config user.name "campusos-bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "notices: refresh" && git push)
